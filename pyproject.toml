[project]
name = "autodocs"
version = "0.1.0"
description = "PR-triggered multi-agent documentation system"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "unidiff>=0.7",
  "supabase>=2.15",
]

[project.optional-dependencies]
worker = ["celery[redis]>=5.4"]
dev = ["httpx>=0.27", "pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

